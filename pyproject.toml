[project]
name = "mazic"
version = "1.0.0"
description = "2D Multiplayer Roguelike Game with FastAPI, WebSockets & 0x72 DungeonTilesetII"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
